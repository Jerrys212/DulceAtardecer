name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ApiSettings__SecretKey: ci-only-placeholder-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Verificar que no falten migraciones
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes

      - name: Construir imágenes Docker
        run: |
          docker build --target runtime -t dulce-api .
          docker build --target migrations -t dulce-migrations .

  deploy:
    name: Desplegar en el VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-dulce
      cancel-in-progress: false
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Desplegar
        run: ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 jerryg@74.208.40.203
