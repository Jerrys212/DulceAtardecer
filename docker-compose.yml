services:
  dulceatardecer:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dulceatardecer
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - dulceatardecer_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      target: runtime
    image: dulceatardecer-api
    container_name: dulceatardecer-api
    restart: unless-stopped
    depends_on:
      dulceatardecer:
        condition: service_healthy
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Server=dulceatardecer,1433;Database=DulceAtardecer;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ApiSettings__SecretKey: ${ApiSettings__SecretKey:?Define ApiSettings__SecretKey en .env}
      InitialAdmin__Username: ${InitialAdmin__Username:-admin}
      InitialAdmin__Password: ${InitialAdmin__Password:?Define InitialAdmin__Password en .env}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

  migrations:
    build:
      context: .
      target: migrations
    image: dulceatardecer-migrations
    profiles: ["tools"]
    depends_on:
      dulceatardecer:
        condition: service_healthy
    environment: *api-environment

volumes:
  dulceatardecer_data:
