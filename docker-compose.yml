services:
  api:
    build:
      context: .
      target: runtime
    image: dulceatardecer-api
    container_name: dulceatardecer-api
    restart: unless-stopped
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST:-dulceatardecer-postgres};Port=5432;Database=${DB_NAME:-dulceatardecer};Username=${POSTGRES_USER:-dulceatardecer};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env};Gss Encryption Mode=Disable"
      ApiSettings__SecretKey: ${ApiSettings__SecretKey:?Define ApiSettings__SecretKey en .env}
      InitialAdmin__Username: ${InitialAdmin__Username:-admin}
      InitialAdmin__Password: ${InitialAdmin__Password:?Define InitialAdmin__Password en .env}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - default
      - db

  migrations:
    build:
      context: .
      target: migrations
    image: dulceatardecer-migrations
    profiles: ["tools"]
    environment: *api-environment
    networks:
      - db

networks:
  db:
    name: ${DB_NETWORK:-dulceatardecer_db}
    external: true
